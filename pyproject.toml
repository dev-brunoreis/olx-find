[project]
name = "olx-find"
version = "0.1.0"
description = "Busca anúncios da OLX e ranqueia por custo/benefício."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
olx-find = "olx_find.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
